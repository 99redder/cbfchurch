<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="cbfWordmarkMobileTitle cbfWordmarkMobileDesc" preserveAspectRatio="xMidYMid meet">
  <title id="cbfWordmarkMobileTitle">Christian Believers Fellowship</title>
  <desc id="cbfWordmarkMobileDesc">Wordmark logo with the church name and address, stacked for small screens.</desc>

  <!-- Primary name, stacked on two lines so the text stays large on mobile -->
  <text x="380" y="78" fill="#ffffff" text-anchor="middle"
        font-family="'Garamond', 'Times New Roman', serif"
        font-size="66" letter-spacing="1.1">
    CHRISTIAN BELIEVERS
  </text>
  <text x="380" y="146" fill="#ffffff" text-anchor="middle"
        font-family="'Garamond', 'Times New Roman', serif"
        font-size="66" letter-spacing="1.1">
    FELLOWSHIP
  </text>

  <!-- Gold accent divider with center mark (echoes the desktop wordmark) -->
  <line x1="205" y1="170" x2="555" y2="170" stroke="#d4a843" stroke-width="2" opacity="0.85" />
  <circle cx="380" cy="170" r="5" fill="#d4a843" />
  <rect x="378" y="156" width="4" height="16" rx="2" fill="#ffffff" />

  <!-- Address -->
  <text x="380" y="205" fill="#e9f1fb" text-anchor="middle"
        font-family="'Georgia', 'Times New Roman', serif"
        font-size="21" letter-spacing="0.6">
    32 CHAPEL LANE · SOMERSWORTH · NEW HAMPSHIRE
  </text>
</svg>
