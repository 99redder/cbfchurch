name: Sync admin-edited page text

# Weekly: copy History/Beliefs text that admins edited on the site into the
# HTML files, so search engines see the current text without running
# JavaScript (see scripts/sync-editable-content.mjs). Commits only when
# something changed. Can also be run by hand: Actions tab > this workflow >
# "Run workflow".
on:
  schedule:
    - cron: '0 10 * * 1'   # Mondays 10:00 UTC (5-6 AM in New Hampshire)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-editable-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pull saved text from the API into the HTML
        shell: bash   # bash with pipefail, so a script failure isn't hidden by tee
        run: node scripts/sync-editable-content.mjs 2>&1 | tee "$RUNNER_TEMP/sync-output.txt"

      - name: Commit and publish if anything changed
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No edits to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync admin-edited page text into HTML"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Ask GitHub Pages to rebuild for this bot commit.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true

      # Runs even if an earlier step failed. The Worker emails the result to
      # SYNC_REPORT_TO (worker/wrangler.jsonc). If this step itself fails, the
      # run shows as failed and GitHub sends its own failure notice.
      - name: Email the result (via the Worker)
        if: always()
        env:
          SYNC_REPORT_SECRET: ${{ secrets.SYNC_REPORT_SECRET }}
          OUTCOME: ${{ job.status }}
          CHANGED: ${{ steps.commit.outputs.changed || 'false' }}
          SHA: ${{ steps.commit.outputs.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          summary=$(cat "$RUNNER_TEMP/sync-output.txt" 2>/dev/null || true)
          commit_url=""
          if [ -n "$SHA" ]; then commit_url="$REPO_URL/commit/$SHA"; fi
          jq -n --arg outcome "$OUTCOME" --argjson changed "$CHANGED" --arg summary "$summary" \
                --arg runUrl "$REPO_URL/actions/runs/$RUN_ID" --arg commitUrl "$commit_url" \
                '{outcome: $outcome, changed: $changed, summary: $summary, runUrl: $runUrl, commitUrl: $commitUrl}' |
            curl -fsS -X POST "https://cbfchurch-api.99redder.workers.dev/api/internal/sync-report" \
              -H "Authorization: Bearer $SYNC_REPORT_SECRET" \
              -H "Content-Type: application/json" \
              --data-binary @-
          echo
