name: Sync blog post pages and sitemap

# Daily: copy the Worker's list of blog posts (/sitemap-posts.xml) into the
# repo as sitemap-posts.xml, so it is served from www.cbfchurch.com. Search
# Console only accepts sitemaps on the site's own domain, not on the
# workers.dev host. Commits only when a post was added, edited, or deleted.
#
# It also rebuilds the static page for every post (posts/<slug>.html) with
# scripts/build-post-pages.mjs. Google cannot load posts from the API, so
# these pages are what it indexes; a post published today gets its page on
# the next run (until then it is served through post.html, see 404.html).
# Can also be run by hand: Actions tab > this workflow > "Run workflow".
on:
  schedule:
    - cron: '30 10 * * *'   # daily 10:30 UTC (5:30-6:30 AM in New Hampshire)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-posts-sitemap
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download the post sitemap from the Worker
        run: |
          tmp="$RUNNER_TEMP/sitemap-posts.xml"
          curl -fsS --retry 3 --retry-delay 10 -o "$tmp" \
            https://cbfchurch-api.99redder.workers.dev/sitemap-posts.xml
          # Only accept a real sitemap with posts in it, so an API problem can
          # never replace the file with an error page or an empty list.
          head -c 5 "$tmp" | grep -q '^<?xml'
          grep -q '<urlset' "$tmp"
          count=$(grep -c '<loc>' "$tmp" || true)
          echo "Posts in sitemap: $count"
          if [ "$count" -lt 1 ]; then echo "No posts in the sitemap; not updating."; exit 1; fi
          cp "$tmp" sitemap-posts.xml

      - name: Build the static post pages
        run: node scripts/build-post-pages.mjs

      - name: Commit and publish if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A sitemap-posts.xml posts
          if git diff --cached --quiet; then
            echo "Post pages and sitemap unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update blog post pages and sitemap"
          git pull --rebase
          git push
          # Ask GitHub Pages to rebuild for this bot commit.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
