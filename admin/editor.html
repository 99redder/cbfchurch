<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Post Editor | CBF Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <style>
    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="sans"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="sans"]::before { content: 'Sans'; }
    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="inter"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="inter"]::before { content: 'Inter'; }
    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="serif"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="serif"]::before { content: 'Serif'; }
    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="georgia"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="georgia"]::before { content: 'Georgia'; }
    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="times"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="times"]::before { content: 'Times'; }
    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="mono"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="mono"]::before { content: 'Monospace'; }
    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="arial"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="arial"]::before { content: 'Arial'; }
    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="verdana"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="verdana"]::before { content: 'Verdana'; }

    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="12px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="12px"]::before { content: '12'; }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="14px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="14px"]::before { content: '14'; }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="16px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="16px"]::before { content: '16'; }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="18px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="18px"]::before { content: '18'; }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="20px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="20px"]::before { content: '20'; }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="24px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="24px"]::before { content: '24'; }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="28px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="28px"]::before { content: '28'; }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="32px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="32px"]::before { content: '32'; }

    #editor-toolbar {
      border: 1px solid #ccc;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      background: #fff;
    }
    .editor-toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
      padding: 4px 6px;
    }
    .editor-toolbar-row + .editor-toolbar-row {
      margin-top: 6px;
    }
    .editor-toolbar-row:last-child {
      border-bottom: none;
      gap: 6px;
      padding-top: 2px;
      padding-bottom: 8px;
    }
    #editor-area {
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }

    .ql-snow .ql-clean,
    .editor-toolbar-btn {
      width: auto;
      min-width: 136px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid #c9d3e0;
      border-radius: 6px;
      background: #f8fafc;
      white-space: nowrap;
      color: #374151;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .ql-snow .ql-clean:hover,
    .editor-toolbar-btn:hover {
      background: #eef2f7;
      border-color: #9fb4cc;
      box-shadow: 0 0 0 2px rgba(74, 127, 181, 0.12);
    }
    .ql-snow .ql-clean svg { display: none; }
    .ql-snow .ql-clean::before {
      content: 'Clear Formatting';
      display: inline-block;
      white-space: nowrap;
      line-height: 1;
      font-size: 13px;
      font-weight: 600;
      color: inherit;
    }

    .editor-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1200;
      padding: 1rem;
    }
    .editor-modal-overlay.active { display: flex; }
    .editor-modal {
      width: min(560px, 100%);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: var(--shadow-hover);
      padding: 1rem 1rem 1.1rem;
    }
    .editor-modal h3 { margin-bottom: .45rem; }
    .editor-modal p { margin-bottom: .85rem; }
    .editor-modal-actions { display: flex; gap: .6rem; justify-content: flex-end; }

    :root[data-theme="dark"] #editor-toolbar,
    :root[data-theme="dark"] .editor-toolbar-row { border-color: #314156; background: var(--color-bg-light); }
    :root[data-theme="dark"] .ql-snow .ql-clean,
    :root[data-theme="dark"] .editor-toolbar-btn { background: #1e2836; border-color: #3a465b; color: #e5edf7; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) #editor-toolbar,
      :root:not([data-theme]) .editor-toolbar-row { border-color: #314156; background: var(--color-bg-light); }
      :root:not([data-theme]) .ql-snow .ql-clean,
      :root:not([data-theme]) .editor-toolbar-btn { background: #1e2836; border-color: #3a465b; color: #e5edf7; }
    }
  </style>
</head>
<body>
  <div class="admin-header">
    <h1 id="editor-title">New Blog Post</h1>
    <div>
      <a href="dashboard.html" style="margin-right:1rem;">&larr; Dashboard</a>
      <a href="#" id="logout-btn" style="margin-right:1rem;">Logout</a>
      <button type="button" class="admin-theme-toggle" id="admin-theme-toggle" aria-label="Toggle dark mode">&#9680;</button>
    </div>
  </div>

  <div class="editor-container">
    <div class="card">
      <div id="editor-error" class="alert alert-error" style="display:none;"></div>
      <div id="editor-success" class="alert alert-success" style="display:none;"></div>

      <form id="post-form">
        <div class="form-group">
          <label for="post-title">Title</label>
          <input type="text" id="post-title" name="title" required placeholder="Enter post title">
        </div>

        <div class="form-group">
          <label for="post-author">Author</label>
          <input type="text" id="post-author" name="author" required placeholder="Enter author name">
        </div>

        <div class="form-group">
          <label>Content</label>
          <div id="editor-toolbar">
            <div class="editor-toolbar-row">
              <span class="ql-formats">
                <select class="ql-font">
                  <option value="sans" selected>Sans</option>
                  <option value="inter">Inter</option>
                  <option value="serif">Serif</option>
                  <option value="georgia">Georgia</option>
                  <option value="times">Times</option>
                  <option value="mono">Monospace</option>
                  <option value="arial">Arial</option>
                  <option value="verdana">Verdana</option>
                </select>
                <select class="ql-size">
                  <option value="12px">12</option>
                  <option value="14px">14</option>
                  <option value="16px" selected>16</option>
                  <option value="18px">18</option>
                  <option value="20px">20</option>
                  <option value="24px">24</option>
                  <option value="28px">28</option>
                  <option value="32px">32</option>
                </select>
                <select class="ql-header">
                  <option selected></option>
                  <option value="1"></option>
                  <option value="2"></option>
                  <option value="3"></option>
                </select>
              </span>
              <span class="ql-formats">
                <button class="ql-bold"></button>
                <button class="ql-italic"></button>
                <button class="ql-underline"></button>
              </span>
              <span class="ql-formats">
                <button class="ql-list" value="ordered"></button>
                <button class="ql-list" value="bullet"></button>
                <button class="ql-blockquote"></button>
              </span>
              <span class="ql-formats">
                <button class="ql-link"></button>
                <button class="ql-image"></button>
              </span>
            </div>
            <div class="editor-toolbar-row">
              <span class="ql-formats">
                <button class="ql-clean" type="button"></button>
              </span>
              <span class="ql-formats">
                <button class="editor-toolbar-btn" id="clear-entry-btn" type="button">Clear Entry</button>
              </span>
            </div>
          </div>
          <div id="editor-area"></div>
          <input type="hidden" id="post-content" name="content">
        </div>

        <div class="editor-actions">
          <button type="submit" class="btn btn-primary">Publish Post</button>
          <a href="dashboard.html" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <div class="editor-modal-overlay" id="clear-entry-modal" aria-hidden="true">
    <div class="editor-modal" role="dialog" aria-modal="true" aria-labelledby="clear-entry-title">
      <h3 id="clear-entry-title">Clear Blog Entry?</h3>
      <p>This will erase the current title, author, and content in the editor. This cannot be undone.</p>
      <div class="editor-modal-actions">
        <button type="button" class="btn btn-outline" id="clear-entry-cancel-btn">Cancel</button>
        <button type="button" class="btn btn-primary" id="clear-entry-confirm-btn">Yes, Clear Entry</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    const Font = Quill.import('formats/font');
    Font.whitelist = ['sans', 'inter', 'serif', 'georgia', 'times', 'mono', 'arial', 'verdana'];
    Quill.register(Font, true);

    const Size = Quill.import('attributors/style/size');
    Size.whitelist = ['12px', '14px', '16px', '18px', '20px', '24px', '28px', '32px'];
    Quill.register(Size, true);

    // Initialize Quill editor
    const quill = new Quill('#editor-area', {
      theme: 'snow',
      placeholder: 'Write your blog post...',
      modules: {
        toolbar: {
          container: '#editor-toolbar',
          handlers: {
            image: imageHandler
          }
        }
      }
    });

    function imageHandler() {
      const input = document.createElement('input');
      input.setAttribute('type', 'file');
      input.setAttribute('accept', 'image/*');
      input.click();

      input.onchange = async () => {
        const file = input.files && input.files[0];
        if (!file) return;

        if (file.size > 5 * 1024 * 1024) {
          showError('Image is too large (max 5MB).');
          return;
        }

        try {
          const dataUrl = await fileToDataUrl(file);
          const range = quill.getSelection(true);
          const index = range ? range.index : quill.getLength();
          quill.insertEmbed(index, 'image', dataUrl, 'user');
          quill.setSelection(index + 1, 0);
        } catch (err) {
          showError('Could not insert image. Try a different file.');
        }
      };
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Failed to read image'));
        reader.readAsDataURL(file);
      });
    }

    // Restore last used author name
    const savedAuthor = localStorage.getItem('cbf-admin-author');
    if (savedAuthor) {
      document.getElementById('post-author').value = savedAuthor;
    }

    // Check if editing existing post
    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('id');
    const clearEntryBtn = document.getElementById('clear-entry-btn');
    const clearEntryModal = document.getElementById('clear-entry-modal');
    const clearEntryCancelBtn = document.getElementById('clear-entry-cancel-btn');
    const clearEntryConfirmBtn = document.getElementById('clear-entry-confirm-btn');

    if (editId) {
      document.getElementById('editor-title').textContent = 'Edit Blog Post';
      loadPost(editId);
    }

    async function loadPost(id) {
      try {
        const res = await authFetch(`${API_BASE}/api/admin/posts/${id}`);
        if (!res.ok) {
          if (res.status === 401) { window.location.href = 'login.html'; return; }
          throw new Error('Failed to load post');
        }
        const post = await res.json();
        document.getElementById('post-title').value = post.title;
        document.getElementById('post-author').value = post.author;
        quill.root.innerHTML = post.content;
      } catch (err) {
        showError(err.message);
      }
    }

    function openClearEntryModal() {
      clearEntryModal?.classList.add('active');
      clearEntryModal?.setAttribute('aria-hidden', 'false');
    }

    function closeClearEntryModal() {
      clearEntryModal?.classList.remove('active');
      clearEntryModal?.setAttribute('aria-hidden', 'true');
    }

    function clearCurrentEntry() {
      document.getElementById('post-title').value = '';
      document.getElementById('post-author').value = '';
      quill.setText('');
      closeClearEntryModal();
    }

    clearEntryBtn?.addEventListener('click', openClearEntryModal);
    clearEntryCancelBtn?.addEventListener('click', closeClearEntryModal);
    clearEntryConfirmBtn?.addEventListener('click', clearCurrentEntry);
    clearEntryModal?.addEventListener('click', (e) => { if (e.target === clearEntryModal) closeClearEntryModal(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && clearEntryModal?.classList.contains('active')) closeClearEntryModal();
    });

    document.getElementById('post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('editor-error');
      const successEl = document.getElementById('editor-success');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const title = document.getElementById('post-title').value.trim();
      const author = document.getElementById('post-author').value.trim();
      const content = quill.root.innerHTML;

      if (!title || !author) {
        showError('Title and author are required');
        return;
      }

      if (quill.getText().trim().length === 0) {
        showError('Post content cannot be empty');
        return;
      }

      // Save author name for next time
      localStorage.setItem('cbf-admin-author', author);

      try {
        const url = editId
          ? `${API_BASE}/api/admin/posts/${editId}`
          : `${API_BASE}/api/admin/posts`;
        const method = editId ? 'PUT' : 'POST';

        const res = await authFetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, author, content })
        });

        if (!res.ok) {
          if (res.status === 401) { window.location.href = 'login.html'; return; }
          const data = await res.json();
          showError(data.error || 'Failed to save post');
          return;
        }

        successEl.textContent = editId ? 'Post updated successfully!' : 'Post published successfully!';
        successEl.style.display = 'block';

        if (!editId) {
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
        }
      } catch (err) {
        showError('Could not connect to server. Please try again.');
      }
    });

    function showError(msg) {
      const el = document.getElementById('editor-error');
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
